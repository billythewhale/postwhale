openapi: 3.0.0
info:
  title: Fusion Service - Private API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: OK

  /orders:
    post:
      operationId: createOrder
      summary: Create order
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, quantity]
              properties:
                sku:
                  type: string
                quantity:
                  type: integer
      responses:
        '201':
          description: Created

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get order by id
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not found
